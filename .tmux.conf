# ──────────────────────────────────────────────────────────────
# TMUX CONFIG
# AUTHOR: mitansh panchal - looph0le
# PALETTE: Everforest Dark Med (mirrors ~/.config/ghostty/auto/theme.ghostty)
#   bg #232a2e   fg #d3c6aa   muted #7a8478   faint #5c6a60
#   green #a7c080   aqua #7fbbb3   yellow #dbbc7f   red #e67e80
# ──────────────────────────────────────────────────────────────

# ── core ──────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on
set -g set-clipboard on
set -g escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g history-limit 50000
set -g focus-events on
set -g mouse on
set -g detach-on-destroy off
set -g remain-on-exit failed
set -g display-time 2000
setw -g mode-keys vi

# ── statusbar: tmux state only (no #() jobs, no subprocesses) ─
set -g status-position bottom
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=#7a8478"
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-separator ""

# left: the session is the identity. Name sessions with C-b N (prefilled
# with the current directory) so this reads "api-server" instead of "0".
set -g status-left " #[fg=#a7c080,bold]#S "

# windows: bright text + green underline for the active one
set -g window-status-format "#[fg=#7a8478] #I:#W "
set -g window-status-current-format "#[fg=#7a8478] #[fg=#e8e0c8,bold,underscore,us=#a7c080] #I:#W #[default]"
set -g window-status-activity-style "fg=#dbbc7f"

# right: pane state · window state · prefix armed · clock
# NOTE: styles inside #{?} must not contain commas, so bg/fg/bold are split.
# DEAD  = pane died and remain-on-exit is holding it open
# SYNC  = synchronize-panes, typing goes to every split in the window
# Z     = window is zoomed, so sibling panes are hidden
# ⬢ name = session is wired to a dev container (set by `devbox`)
set -g status-right "#{?pane_dead,#[bg=#e67e80]#[fg=#232a2e]#[bold] DEAD ,}#{?pane_synchronized,#[bg=#e67e80]#[fg=#232a2e]#[bold] SYNC ,}#{?client_prefix,#[bg=#a7c080]#[fg=#232a2e]#[bold] PREFIX ,}#[fg=#7fbbb3]#{?@dev_container,⬢ #{@dev_container} ,}#[fg=#dbbc7f]#{?window_zoomed_flag,Z }#[default]%H:%M "

# a build that finishes in a background window turns its window entry red
set -g bell-action other
setw -g monitor-bell on
set -g window-status-bell-style "fg=#232a2e,bg=#e67e80,bold"

# ── panes & copy mode ─────────────────────────────────────────
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-style "fg=#3a464c"
set -g pane-active-border-style "fg=#5c6a60"

set -g mode-style "bg=#3a464c,fg=#f2efdf"
set -g message-style "bg=#2e383c,fg=#d3c6aa"
set -g message-command-style "bg=#2e383c,fg=#d3c6aa"
set -g display-panes-colour "#7a8478"
set -g display-panes-active-colour "#a7c080"
set -g clock-mode-colour "#a7c080"

# ── popups & menus ────────────────────────────────────────────
set -g popup-style "bg=#232a2e,fg=#d3c6aa"
set -g popup-border-style "fg=#5c6a60"
set -g popup-border-lines rounded
set -g menu-style "bg=#2e383c,fg=#d3c6aa"
set -g menu-selected-style "bg=#3a464c,fg=#a7c080"
set -g menu-border-style "fg=#5c6a60"
set -g menu-border-lines rounded

# ── keybindings ───────────────────────────────────────────────
# reload (r for new habits, R for old ones)
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
bind R source-file ~/.tmux.conf \; display-message "config reloaded"

# splits & windows, always inheriting the pane's cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# pane nav (repeatable)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# pane resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# l is pane-right now, so last-window moves to Tab
bind Tab last-window

# session / window tree, full screen
bind S choose-tree -Zw

# ── popups ────────────────────────────────────────────────────
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " lazygit " -S "fg=#a7c080" "lazygit"
bind b display-popup -E -w 90% -h 85% -d "#{pane_current_path}" -T " btop " -S "fg=#7fbbb3" "btop"
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -T " shell " -S "fg=#dbbc7f" "$SHELL -l"
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " nvim " -S "fg=#a7c080" "nvim ."
bind a display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " opencode " -S "fg=#d699b6" "opencode"
bind ? display-popup -E -w 80% -h 80% -T " keys " -S "fg=#7a8478" "tmux list-keys | less -R"
bind m command-prompt -p "man:" "display-popup -E -w 80% -h 80% -T ' man %% ' -S 'fg=#dbbc7f' 'man %%'"

# ── dev container popups (see ~/.local/bin/dc, dsh, drun, dlogs) ──
# These walk up from the pane's directory to the nearest
# .devcontainer/compose.yaml, so they work from any pane in the project.
bind C display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " container " -S "fg=#7fbbb3" "dsh"
bind D display-popup -E -w 90% -h 85% -d "#{pane_current_path}" -T " compose logs " -S "fg=#e67e80" "dlogs"
bind T display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -T " test " -S "fg=#dbbc7f" "drun npm test"

# ── dev extras ────────────────────────────────────────────────
# named project sessions: create-or-attach, rooted at the current dir.
# -I prefills the prompt with the directory name, so it is Enter-and-go.
bind N command-prompt -I "#{b:pane_current_path}" -p "project:" "new-session -A -s '%%' -c '#{pane_current_path}'"

# what is listening right now (ports, pids, process names) + container state
bind P display-popup -E -w 80% -h 60% -T " ports " -S "fg=#e67e80" "sh -c 'lsof -nP -iTCP -sTCP:LISTEN | sort -k9; echo; dc ps 2>/dev/null' | less -R"

# edit this config in a popup, reload on quit
bind v display-popup -E -w 85% -h 85% -T " tmux.conf " -S "fg=#dbbc7f" "nvim ~/.tmux.conf && tmux source-file ~/.tmux.conf"

# respawn a pane left open by remain-on-exit failed
bind X respawn-pane -k

# layout presets (menu, because M-1..M-4 are unreachable while
# Ghostty's macos-option-as-alt is off: Option+1 emits "¡", not ESC 1)
bind L display-menu -T " layout " -x C -y C \
  "main-vertical"   1 "select-layout main-vertical" \
  "main-horizontal" 2 "select-layout main-horizontal" \
  "even-horizontal" 3 "select-layout even-horizontal" \
  "tiled"           4 "select-layout tiled"

# ── copy mode: yank to the macOS clipboard ────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# host tmux has pbcopy; the fallback keeps this config working if tmux is ever
# run inside a container, where OSC 52 (set-clipboard on) is the only route.
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' \
  'bind -T copy-mode-vi y send -X copy-selection-and-cancel'
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"' \
  'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel'
