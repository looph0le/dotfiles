"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
scan_timeout = 15
command_timeout = 500
follow_symlinks = false

format = """\
$username\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$python\
$character"""

[username]
disabled = false
show_always = false
style_user = "bold fg:bright-black"
format = "[$user]($style) "

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
symbol = ""
style = "bright-black"
format = "[$symbol$branch]($style) "
truncation_length = 15
truncation_symbol = "…"

[git_state]
style = "bright-black italic"
format = "([$state( $progress_current/$progress_total)]($style)) "

[git_status]
style = "cyan"
format = "[($all_status$ahead_behind)]($style) "
conflicted = "[⚡$count](red)"
staged = "[+$count](green)"
modified = "[*$count](red)"
deleted = "[-$count](red)"
untracked = "[?$count](bright-black)"
ahead = "⇡$count"
behind = "⇣$count"

[cmd_duration]
min_time = 1_500
show_milliseconds = false
style = "yellow"
format = "[$duration]($style) "

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

[character]
format = "$symbol "
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold yellow) "